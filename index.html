:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);
  --glass: rgba(255,255,255,0.6);
  --danger: #b4493c;

  --display: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
    --glass: var(--surface);
    --danger: #e08a7d;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
  --glass: var(--surface);
  --danger: #e08a7d;
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}
.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 28px;
  padding-bottom: 60px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
  gap:20px;
}
.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}
h1{ font-family:var(--display); font-weight:900; font-size:34px; line-height:1.3; margin:0 0 14px; }
h2.q-text{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1.5; margin:0 0 20px; }
p.lede{ font-size:16px; color:var(--ink-soft); line-height:1.7; margin:0 0 28px; }
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 20px;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--body); font-weight:700; font-size:16px;
  padding:15px 22px; border-radius:999px; border:none; cursor:pointer;
  background:var(--accent); color:#fff;
  width:100%;
  transition: transform .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(0.98); }
.btn.secondary{
  background:var(--surface-2); color:var(--ink);
}
.btn[disabled]{ opacity:0.45; cursor:default; }
.progress{
  height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:10px;
}
.progress .bar{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; width:0%; }
.q-count{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; letter-spacing:0.05em; }
.q-options{ display:flex; flex-direction:column; gap:12px; }
.q-option{
  text-align:left;
  background:var(--surface); border:1.5px solid var(--line); border-radius:16px;
  padding:16px 18px; font-family:var(--body); font-size:15.5px; color:var(--ink);
  cursor:pointer; line-height:1.6;
  transition: border-color .15s ease, background .15s ease;
}
.q-option:active{ background:var(--accent-soft); border-color:var(--accent); }

.result-type{
  font-family:var(--display); font-weight:900; font-size:30px; color:var(--accent); margin:0 0 6px;
}
.result-tagline{ font-size:16px; color:var(--ink-soft); margin:0 0 18px; }
.result-desc{ font-size:15.5px; line-height:1.85; margin:0 0 24px; }
.dim-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.dim-label{ width:92px; font-size:13px; color:var(--ink-soft); flex-shrink:0; }
.dim-track{ flex:1; height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.dim-fill{ height:100%; background:var(--accent-2); border-radius:999px; }

.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
.field input, .field textarea{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--surface); color:var(--ink); font-family:var(--body); font-size:15.5px;
}
.field textarea{ resize:vertical; min-height:80px; }
.hint{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

.candidate{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:18px 18px; margin-bottom:14px;
}
.candidate-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.candidate-name{ font-weight:700; font-size:16px; }
.candidate-score{
  font-size:13px; font-weight:700; color:var(--accent);
  background:var(--accent-soft); padding:4px 10px; border-radius:999px;
}
.candidate-type{ font-size:13.5px; color:var(--accent-2); font-weight:700; margin-bottom:6px; }
.candidate-bio{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px; }
.candidate .btn{ padding:11px 18px; font-size:14px; }
.candidate .btn.sent{ background:var(--surface-2); color:var(--ink-soft); }

.empty-note{ font-size:14.5px; color:var(--ink-soft); line-height:1.8; text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<div class="wrap">

  <section class="stage" id="stage-intro">
    <div class="eyebrow">女同人格 × 書本人格</div>
    <h1>妳是哪一種讀書人？</h1>
    <p class="lede">12 題測出妳的書本人格，測完還能直接看到口味合拍的候選名單——雙方都同意，才會交換聯絡方式。</p>
    <button class="btn" id="start-btn">開始測驗</button>
  </section>

  <section class="stage" id="stage-quiz" hidden>
    <div class="progress"><div class="bar" id="progress-bar"></div></div>
    <div class="q-count" id="q-count"></div>
    <h2 class="q-text" id="q-text"></h2>
    <div class="q-options" id="q-options"></div>
  </section>

  <section class="stage" id="stage-result" hidden>
    <div class="eyebrow">測驗結果</div>
    <div class="result-type" id="result-type"></div>
    <div class="result-tagline" id="result-tagline"></div>
    <div class="card" style="margin-bottom:22px;">
      <p class="result-desc" id="result-desc" style="margin-bottom:20px;"></p>
      <div id="result-dims"></div>
    </div>
    <button class="btn" id="goto-signup-btn">想認識口味合拍的新朋友</button>
  </section>

  <section class="stage" id="stage-signup" hidden>
    <div class="eyebrow">認識新朋友</div>
    <h1 style="font-size:26px;">填幾個資料，馬上看候選名單</h1>
    <p class="lede" style="margin-bottom:22px;">暱稱跟自我介紹會顯示給其他人看，Email 只有在雙方都同意後才會交換，邀請送出前不會曝光。</p>
    <div class="card">
      <div class="field">
        <label for="f-nickname">暱稱</label>
        <input id="f-nickname" type="text" maxlength="20" required>
      </div>
      <div class="field">
        <label for="f-bio">一句話自我介紹</label>
        <textarea id="f-bio" maxlength="140" required placeholder="例如：愛讀推理小說，最近迷上找人討論結局"></textarea>
      </div>
      <div class="field">
        <label for="f-email">Email</label>
        <input id="f-email" type="email" required>
        <div class="hint">只有雙方都同意交換後才會用到，邀請送出前完全不會公開。</div>
      </div>
      <button class="btn" id="submit-signup-btn">看候選名單</button>
    </div>
  </section>

  <section class="stage" id="stage-candidates" hidden>
    <div class="eyebrow">候選名單</div>
    <h1 style="font-size:26px;">跟妳口味合拍的讀書人</h1>
    <p class="lede" id="candidates-sub" style="margin-bottom:22px;">依照書本人格相似度排序，送出邀請後，要等對方同意才會交換聯絡方式。</p>
    <div id="candidates-list"></div>
  </section>

</div>

var state = {
  vec: [5,5,5,5,5],
  qIndex: 0,
  resultType: null,
  me: { nickname:"", email:"", bio:"" }
};

function $(id){ return document.getElementById(id); }
function show(id){ document.querySelectorAll(".stage").forEach(function(s){ s.hidden = (s.id !== id); }); window.scrollTo(0,0); }

function clampVec(v){
  return v.map(function(n){ return Math.max(0, Math.min(10, n)); });
}

function renderQuestion(){
  var q = QUESTIONS[state.qIndex];
  $("progress-bar").style.width = Math.round((state.qIndex / QUESTIONS.length) * 100) + "%";
  $("q-count").textContent = "第 " + (state.qIndex + 1) + " / " + QUESTIONS.length + " 題";
  $("q-text").textContent = q.text;
  var wrap = $("q-options");
  wrap.innerHTML = "";
  q.options.forEach(function(opt){
    var btn = document.createElement("button");
    btn.className = "q-option";
    btn.type = "button";
    btn.textContent = opt.label;
    btn.addEventListener("click", function(){ answer(opt.delta); });
    wrap.appendChild(btn);
  });
}

function answer(delta){
  for (var i = 0; i < 5; i++) state.vec[i] += delta[i];
  state.qIndex++;
  if (state.qIndex >= QUESTIONS.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function nearestArchetype(vec){
  var best = null, bestDist = Infinity;
  ARCHETYPES.forEach(function(a){
    var d = 0;
    for (var i = 0; i < 5; i++) { var diff = vec[i] - a.vec[i]; d += diff * diff; }
    d = Math.sqrt(d);
    if (d < bestDist) { bestDist = d; best = a; }
  });
  return best;
}

function finishQuiz(){
  state.vec = clampVec(state.vec);
  var type = nearestArchetype(state.vec);
  state.resultType = type;
  $("result-type").textContent = type.name;
  $("result-tagline").textContent = type.tagline;
  $("result-desc").textContent = type.desc;
  var dimsWrap = $("result-dims");
  dimsWrap.innerHTML = "";
  DIMS.forEach(function(d, i){
    var row = document.createElement("div");
    row.className = "dim-row";
    row.innerHTML = "<div class='dim-label'>" + DIM_LABELS[d] + "</div>" +
      "<div class='dim-track'><div class='dim-fill' style='width:" + (state.vec[i] * 10) + "%'></div></div>";
    dimsWrap.appendChild(row);
  });
  show("stage-result");
}

function submitSignup(){
  var nickname = $("f-nickname").value.trim();
  var bio = $("f-bio").value.trim();
  var email = $("f-email").value.trim();
  if (!nickname || !bio || !email) return;

  state.me.nickname = nickname;
  state.me.bio = bio;
  state.me.email = email;

  if (APPS_SCRIPT_URL) {
    try {
      fetch(APPS_SCRIPT_URL, {
        method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({
          nickname: nickname, email: email, bio: bio,
          archetype: state.resultType.name, vector: state.vec
        })
      }).catch(function(){});
    } catch(e){}
  }

  show("stage-candidates");
  loadCandidates();
}

function loadCandidates(){
  var listEl = $("candidates-list");
  if (!APPS_SCRIPT_URL) {
    listEl.innerHTML = "<div class='empty-note'>配對系統還在設定中，晚點再回來看看吧！</div>";
    return;
  }
  listEl.innerHTML = "<div class='empty-note'>找合拍的人中⋯⋯</div>";

  var cbName = "bookMatchCb_" + Date.now();
  window[cbName] = function(resp){
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    renderCandidates((resp && resp.candidates) || []);
  };
  var script = document.createElement("script");
  var url = APPS_SCRIPT_URL + "?action=candidates" +
    "&vec=" + encodeURIComponent(state.vec.join(",")) +
    "&excludeEmail=" + encodeURIComponent(state.me.email) +
    "&callback=" + cbName;
  script.src = url;
  script.onerror = function(){
    listEl.innerHTML = "<div class='empty-note'>暫時連不上配對系統，等一下再試試看。</div>";
  };
  document.body.appendChild(script);
}

function renderCandidates(list){
  var listEl = $("candidates-list");
  if (!list.length) {
    listEl.innerHTML = "<div class='empty-note'>目前還沒有合拍的候選人，晚點再回來看看——名單會一直更新。</div>";
    return;
  }
  listEl.innerHTML = "";
  list.forEach(function(c){
    var card = document.createElement("div");
    card.className = "candidate";
    card.innerHTML =
      "<div class='candidate-top'>" +
        "<div class='candidate-name'>" + escapeHtml(c.nickname) + "</div>" +
        "<div class='candidate-score'>" + c.score + "% 合拍</div>" +
      "</div>" +
      "<div class='candidate-type'>" + escapeHtml(c.type) + "</div>" +
      "<div class='candidate-bio'>" + escapeHtml(c.bio) + "</div>" +
      "<button class='btn' type='button'>送出交友邀請</button>";
    var btn = card.querySelector("button");
    btn.addEventListener("click", function(){ sendInvite(c, btn); });
    listEl.appendChild(card);
  });
}

function sendInvite(candidate, btn){
  btn.textContent = "已送出邀請";
  btn.className = "btn sent";
  btn.disabled = true;
  if (!APPS_SCRIPT_URL) return;
  try {
    fetch(APPS_SCRIPT_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        action:"invite",
        fromNickname: state.me.nickname,
        fromEmail: state.me.email,
        fromBio: state.me.bio,
        fromArchetype: state.resultType.name,
        toPublicId: candidate.publicId
      })
    }).catch(function(){});
  } catch(e){}
}

function escapeHtml(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

$("start-btn").addEventListener("click", function(){
  state.qIndex = 0;
  state.vec = [5,5,5,5,5];
  show("stage-quiz");
  renderQuestion();
});
$("goto-signup-btn").addEventListener("click", function(){ show("stage-signup"); });
$("submit-signup-btn").addEventListener("click", submitSignup);

})();
